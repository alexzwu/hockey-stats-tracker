<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </radialGradient>
    <linearGradient id="puckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer Ice Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#cyanGrad)" stroke-width="14" stroke-dasharray="16 10"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#243456" stroke-width="4"/>

  <!-- Crossed Hockey Sticks -->
  <path d="M120 380 L350 150 L380 180 L150 410 Z" fill="#94a3b8" opacity="0.3"/>
  <path d="M392 380 L162 150 L132 180 L362 410 Z" fill="#94a3b8" opacity="0.3"/>

  <!-- Center Hockey Puck -->
  <ellipse cx="256" cy="256" rx="90" ry="70" fill="url(#puckGrad)" stroke="#f59e0b" stroke-width="8"/>
  <ellipse cx="256" cy="246" rx="86" ry="60" fill="#1e293b"/>
  
  <!-- Spotter Crosshairs / Focus Ring -->
  <circle cx="256" cy="246" r="40" fill="none" stroke="#38bdf8" stroke-width="6"/>
  <line x1="256" y1="190" x2="256" y2="215" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="277" x2="256" y2="302" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="200" y1="246" x2="225" y2="246" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="287" y1="246" x2="312" y2="246" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
</svg>
